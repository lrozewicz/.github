# Reusable deploy: build once, promote by tag, deploy through GitOps.
#
#   push to main         -> environment dev
#   release tag (v1.2.3) -> environment prod (the tag must point to a commit on main)
#
# The image is tagged with the git tree SHA (HEAD^{tree}), so identical code always maps to the
# same image. If that image already exists in Harbor (a release tag on a commit that was already
# deployed to dev), nothing is rebuilt: the image only gets the "<environment>-<tree>" tag (and the
# release tag). Then the workflow commits that tag to apps/<app>/<environment>/values.yaml in
# platform-gitops and Argo CD deploys it. The workflow never talks to the cluster.
#
# One image by default (<registry>/<app>/app, Dockerfile at the repo root). An application made of
# several processes passes `images`, a JSON list of
#   {"name": "backend", "context": "backend", "dockerfile": "backend/Dockerfile", "test": true}
# (`context`, `dockerfile` and `test` are optional); each is pushed as <registry>/<app>/<name> and all
# share the same tag. Jobs: plan (checks, tree tag) -> image (one per image, no environment, so a prod
# approval is asked once) -> deploy-<environment> (environment gate, commit to platform-gitops).
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or prod)
        type: string
        required: true
      app:
        description: App name (Harbor project and apps/<app> in platform-gitops); defaults to the repo name
        type: string
        default: ""
      context:
        description: Docker build context (single image)
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile (single image)
        type: string
        default: Dockerfile
      images:
        description: JSON list of images to build (see the header); empty = one image "app" from context/dockerfile
        type: string
        default: ""
      registry:
        type: string
        default: harbor.lucasnextgen.com
      gitops-repository:
        description: GitOps repo (owner/name)
        type: string
        default: lrozewicz/platform-gitops
      gitops-app-client-id:
        description: Client ID of the GitHub App allowed to push to the GitOps repo
        type: string
        default: Iv23lisLSmlCJFUCFckY
    secrets:
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true
      GITOPS_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: plan-${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app: ${{ steps.vars.outputs.app }}
      images: ${{ steps.vars.outputs.images }}
      tree: ${{ steps.vars.outputs.tree }}
      env-tag: ${{ steps.vars.outputs.env-tag }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      APP: ${{ inputs.app || github.event.repository.name }}
    steps:
      - name: Validate inputs
        run: |
          case "$ENVIRONMENT" in dev|prod) ;; *) echo "::error::environment must be dev or prod"; exit 1 ;; esac
          [[ "$APP" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::invalid app name: $APP"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # prod: full history, to check that the release tag is on the default branch
          fetch-depth: ${{ inputs.environment == 'prod' && '0' || '1' }}

      - name: Check that a prod release is a tag on the default branch
        if: inputs.environment == 'prod'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::prod is deployed only from a release tag (got $REF_TYPE $REF_NAME)"
            exit 1
          fi
          [[ "$REF_NAME" =~ ^v[0-9A-Za-z._-]{1,100}$ ]] || { echo "::error::invalid release tag: $REF_NAME"; exit 1; }
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "::error::tag $REF_NAME does not point to a commit on $DEFAULT_BRANCH"
            exit 1
          fi

      - name: Image coordinates
        id: vars
        env:
          IMAGES: ${{ inputs.images }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [ -z "$IMAGES" ]; then
            IMAGES="$(jq -cn --arg c "$CONTEXT" --arg d "$DOCKERFILE" '[{name: "app", context: $c, dockerfile: $d}]')"
          fi
          list="$(jq -c '[.[] | {name, context: (.context // "."), dockerfile: (.dockerfile // "Dockerfile"), test: (.test // true)}]' <<< "$IMAGES")"
          jq -e 'length > 0 and all(.[]; .name | test("^[a-z0-9][a-z0-9-]*$"))' <<< "$list" > /dev/null \
            || { echo "::error::invalid images list"; exit 1; }
          tree="$(git rev-parse 'HEAD^{tree}')"
          {
            echo "app=$APP"
            echo "images=$list"
            echo "tree=$tree"
            echo "env-tag=$ENVIRONMENT-$tree"
          } >> "$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.image.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      NAME: ${{ inputs.registry }}/${{ needs.plan.outputs.app }}/${{ matrix.image.name }}
      TREE: ${{ needs.plan.outputs.tree }}
      ENV_TAG: ${{ needs.plan.outputs.env-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Look for an existing image of this tree
        id: existing
        run: |
          if docker buildx imagetools inspect "$NAME:$TREE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image $NAME:$TREE already exists: promoting it without a rebuild." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test (target "test")
        if: steps.existing.outputs.found == 'false' && matrix.image.test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: test
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Build and push runtime image
        if: steps.existing.outputs.found == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: runtime
          push: true
          provenance: false
          tags: ${{ env.NAME }}:${{ env.TREE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      # Scanned on every deploy, also on promotion: new CVEs may have been published since the build.
      - name: Trivy scan (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        with:
          image-ref: ${{ env.NAME }}:${{ env.TREE }}
          severity: CRITICAL
          format: table
          exit-code: "1"
          ignore-unfixed: true

      - name: Tag image for ${{ inputs.environment }}
        # --prefer-index=false: copy the manifest as is, so both tags point to the same digest.
        run: docker buildx imagetools create --prefer-index=false --tag "$NAME:$ENV_TAG" "$NAME:$TREE"

      - name: Tag image with the release version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ github.ref_name }}
        run: docker buildx imagetools create --prefer-index=false --tag "$NAME:$VERSION" "$NAME:$TREE"

  deploy:
    name: deploy-${{ inputs.environment }}
    needs: [plan, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      APP: ${{ needs.plan.outputs.app }}
    steps:
      - name: GitOps repo coordinates
        id: gitops
        env:
          REPO: ${{ inputs.gitops-repository }}
        run: |
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: GitHub App token for the GitOps repo
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.gitops-app-client-id }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ steps.gitops.outputs.owner }}
          repositories: ${{ steps.gitops.outputs.name }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitops-repository }}
          token: ${{ steps.token.outputs.token }}
          path: gitops

      - name: Commit image tag to GitOps repo
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
          TAG: ${{ needs.plan.outputs.env-tag }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          file="apps/$APP/$ENVIRONMENT/values.yaml"
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$branch"
            git reset -q --hard "origin/$branch"
            if [ ! -f "$file" ]; then
              echo "::error::$file does not exist in the GitOps repo; run the app bootstrap script first"
              exit 1
            fi
            if [ "$(yq '.image.tag' "$file")" = "$TAG" ]; then
              echo "$file already has image.tag $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            yq -i '.image.tag = strenv(TAG)' "$file"
            git commit -q -m "$APP $ENVIRONMENT: deploy ${VERSION:+$VERSION }${TAG:0:16}" -m "Source: $SOURCE" -- "$file"
            if git push -q origin "HEAD:$branch"; then
              echo "Deployed $TAG to $APP/$ENVIRONMENT via $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the GitOps repo"
          exit 1
