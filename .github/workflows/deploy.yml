# Reusable deploy: build once, promote by tag, deploy through GitOps.
#
# The image is tagged with the git tree SHA (HEAD^{tree}), so identical code always maps to the
# same image. If that image already exists in Harbor (e.g. main after merging a tested dev),
# nothing is rebuilt: the image only gets the "<environment>-<tree>" tag. Then the workflow
# commits that tag to apps/<app>/<environment>/values.yaml in platform-gitops and Argo CD deploys it.
# The workflow never talks to the cluster.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or prod)
        type: string
        required: true
      app:
        description: App name (Harbor project and apps/<app> in platform-gitops); defaults to the repo name
        type: string
        default: ""
      context:
        description: Docker build context
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile
        type: string
        default: Dockerfile
      registry:
        type: string
        default: harbor.lucasnextgen.com
      gitops-repository:
        description: GitOps repo (owner/name)
        type: string
        default: lrozewicz/platform-gitops
      gitops-app-client-id:
        description: Client ID of the GitHub App allowed to push to the GitOps repo
        type: string
        default: Iv23lisLSmlCJFUCFckY
    secrets:
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true
      GITOPS_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      APP: ${{ inputs.app || github.event.repository.name }}
      REGISTRY: ${{ inputs.registry }}
    steps:
      - name: Validate inputs
        run: |
          case "$ENVIRONMENT" in dev|prod) ;; *) echo "::error::environment must be dev or prod"; exit 1 ;; esac
          [[ "$APP" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::invalid app name: $APP"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image coordinates
        id: image
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          {
            echo "name=$REGISTRY/$APP/app"
            echo "tree=$tree"
            echo "env-tag=$ENVIRONMENT-$tree"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Look for an existing image of this tree
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tree }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE already exists: promoting it without a rebuild." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test (target "test")
        if: steps.existing.outputs.found == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push runtime image
        if: steps.existing.outputs.found == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: runtime
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tree }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scanned on every deploy, also on promotion: new CVEs may have been published since the build.
      - name: Trivy scan (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tree }}
          severity: CRITICAL
          format: table
          exit-code: "1"
          ignore-unfixed: true

      - name: Tag image for ${{ inputs.environment }}
        env:
          SRC: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tree }}
          DST: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.env-tag }}
        # --prefer-index=false: copy the manifest as is, so both tags point to the same digest.
        run: docker buildx imagetools create --prefer-index=false --tag "$DST" "$SRC"

      - name: GitOps repo coordinates
        id: gitops
        env:
          REPO: ${{ inputs.gitops-repository }}
        run: |
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: GitHub App token for the GitOps repo
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.gitops-app-client-id }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ steps.gitops.outputs.owner }}
          repositories: ${{ steps.gitops.outputs.name }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitops-repository }}
          token: ${{ steps.token.outputs.token }}
          path: gitops

      - name: Commit image tag to GitOps repo
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
          TAG: ${{ steps.image.outputs.env-tag }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          file="apps/$APP/$ENVIRONMENT/values.yaml"
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$branch"
            git reset -q --hard "origin/$branch"
            if [ ! -f "$file" ]; then
              echo "::error::$file does not exist in the GitOps repo; run the app bootstrap script first"
              exit 1
            fi
            if [ "$(yq '.image.tag' "$file")" = "$TAG" ]; then
              echo "$file already has image.tag $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            yq -i '.image.tag = strenv(TAG)' "$file"
            git commit -q -m "$APP $ENVIRONMENT: deploy ${TAG:0:16}" -m "Source: $SOURCE" -- "$file"
            if git push -q origin "HEAD:$branch"; then
              echo "Deployed $TAG to $APP/$ENVIRONMENT via $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the GitOps repo"
          exit 1
