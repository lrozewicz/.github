# Reusable PR checks: tests (Dockerfile target "test"), runtime image build, Trivy scan.
# Runs on code from forks, so it gets no secrets and a read-only token, and pushes nothing.
#
# One image by default (Dockerfile at the repo root). Several images: pass `images`, a JSON list of
#   {"name": "backend", "context": "backend", "dockerfile": "backend/Dockerfile", "test": true}
# (`context`, `dockerfile` and `test` are optional). Each image gets its own jobs; the final job
# `checks` (the required status check "pr / checks") is green only when all of them are.
name: PR checks

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context (single image)
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile (single image)
        type: string
        default: Dockerfile
      images:
        description: JSON list of images to build (see the header); empty = one image from context/dockerfile
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - name: Image list
        id: plan
        env:
          IMAGES: ${{ inputs.images }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [ -z "$IMAGES" ]; then
            IMAGES="$(jq -cn --arg c "$CONTEXT" --arg d "$DOCKERFILE" '[{name: "app", context: $c, dockerfile: $d}]')"
          fi
          list="$(jq -c '[.[] | {name, context: (.context // "."), dockerfile: (.dockerfile // "Dockerfile"), test: (.test // true)}]' <<< "$IMAGES")"
          jq -e 'length > 0 and all(.[]; .name | test("^[a-z0-9][a-z0-9-]*$"))' <<< "$list" > /dev/null \
            || { echo "::error::invalid images list"; exit 1; }
          echo "images=$list" >> "$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.image.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Test (target "test")
        if: matrix.image.test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: test
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: runtime
          load: true
          tags: pr-image:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}

      - name: Trivy scan (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pr-image:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pr-image:${{ github.sha }}
          severity: CRITICAL
          format: table
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

  # The single required status check ("pr / checks"): green only when every image job is.
  checks:
    needs: [plan, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "plan: $PLAN, images: $IMAGE"
          [ "$PLAN" = success ] && [ "$IMAGE" = success ]
