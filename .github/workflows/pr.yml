# Reusable PR checks: tests (Dockerfile target "test"), runtime image build, Trivy scan.
# Runs on code from forks, so it gets no secrets and a read-only token, and pushes nothing.
name: PR checks

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile
        type: string
        default: Dockerfile

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Test (target "test")
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: runtime
          load: true
          tags: pr-image:${{ github.sha }}
          cache-from: type=gha

      - name: Trivy scan (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pr-image:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pr-image:${{ github.sha }}
          severity: CRITICAL
          format: table
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true
